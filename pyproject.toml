[project]
name = "atbbs"
version = "1.4.2"
description = "Decentralized bulletin boards on atproto."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "authlib>=1.8.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "platformdirs>=4.11.7",
    "rich-click>=1.9.9",
    "textual>=8.2.8",
    "piexif>=1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
atbbs = "cli.__main__:main"
atbbs-telnet = "telnet.server:main"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "telnet", "tui"]

[tool.hatch.build.targets.wheel.force-include]
"data/shared.json" = "core/_shared.json"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
